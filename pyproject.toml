[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-mcp-client"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_mcp_client = ["ui/*.html", "prompt/*.txt"]

