<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hình ảnh từ kho tri thức Đông Hải</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
      --surface: light-dark(#ffffff, #191919);
      --surface-raised: light-dark(#ffffff, #242424);
      --surface-muted: light-dark(#f4f4f2, #111111);
      --text: light-dark(#171717, #f7f7f5);
      --muted: light-dark(#676767, #aaa9a5);
      --border: light-dark(#e8e5df, #393939);
      --accent: #d61f2c;
      --accent-soft: light-dark(#fff0f1, #401a1e);
      --shadow: 0 12px 32px rgb(0 0 0 / 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: transparent;
      color: var(--text);
    }

    body { padding: 8px; }

    .shell {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      overflow: hidden;
      box-shadow: 0 1px 0 rgb(255 255 255 / 0.04) inset;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
    }

    .mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: linear-gradient(145deg, #e52b38, #aa101a);
      box-shadow: 0 7px 18px rgb(214 31 44 / 0.24);
      flex: 0 0 auto;
    }

    .mark::after {
      content: "ĐH";
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .heading { min-width: 0; }

    .eyebrow {
      margin-bottom: 2px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #count {
      margin-left: auto;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-muted);
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }

    #status {
      padding: 22px 16px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    #gallery {
      display: flex;
      gap: 10px;
      padding: 12px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scroll-snap-type: inline mandatory;
      scrollbar-width: thin;
    }

    figure {
      position: relative;
      flex: 1 0 min(76vw, 310px);
      margin: 0;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--surface-raised);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.06);
      scroll-snap-align: start;
      transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    figure:hover {
      border-color: light-dark(#d0cbc2, #535353);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .image-button {
      position: relative;
      display: block;
      width: 100%;
      height: clamp(210px, 32vw, 315px);
      padding: 0;
      overflow: hidden;
      border: 0;
      cursor: zoom-in;
      background:
        radial-gradient(circle at 18% 16%, rgb(214 31 44 / 0.07), transparent 33%),
        #ffffff;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      padding: 8px;
      object-fit: contain;
      transition: transform 220ms ease;
    }

    .image-button:hover img { transform: scale(1.025); }

    .page-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      padding: 5px 8px;
      border: 1px solid rgb(255 255 255 / 0.58);
      border-radius: 999px;
      color: #282828;
      background: rgb(255 255 255 / 0.86);
      box-shadow: 0 3px 12px rgb(0 0 0 / 0.1);
      backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 700;
    }

    .zoom-hint {
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 5px 8px;
      border-radius: 8px;
      color: white;
      background: rgb(20 20 20 / 0.72);
      opacity: 0;
      font-size: 10px;
      font-weight: 650;
      backdrop-filter: blur(8px);
      transition: opacity 160ms ease;
    }

    .image-button:hover .zoom-hint,
    .image-button:focus-visible .zoom-hint { opacity: 1; }

    figcaption {
      min-height: 62px;
      padding: 10px 12px 11px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .title {
      display: block;
      margin-bottom: 2px;
      color: var(--text);
      font-weight: 650;
      font-size: 13px;
    }

    #viewer[hidden] { display: none; }

    #viewer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: 14px;
      background: rgb(10 10 10 / 0.94);
      backdrop-filter: blur(16px);
    }

    .viewer-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 10px;
      color: white;
    }

    #viewer-title {
      min-width: 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #close-viewer {
      width: 34px;
      height: 34px;
      margin-left: auto;
      border: 1px solid rgb(255 255 255 / 0.18);
      border-radius: 999px;
      color: white;
      background: rgb(255 255 255 / 0.1);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    #viewer-image {
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 0;
      object-fit: contain;
    }

    @media (min-width: 700px) {
      #gallery[data-count="1"] figure {
        max-width: 560px;
        margin-inline: auto;
      }

      #gallery[data-count="2"] figure {
        flex-basis: calc(50% - 5px);
      }

      #gallery[data-count="3"] figure {
        flex-basis: calc(33.333% - 7px);
      }
    }

    @media (max-width: 480px) {
      body { padding: 4px; }
      header { padding-inline: 11px; }
      #count { display: none; }
      #gallery { padding: 9px; }
      figure { flex-basis: 88%; }
      .image-button { height: 230px; }
    }

    @media (prefers-reduced-motion: reduce) {
      figure, img, .zoom-hint { transition: none; }
    }
  </style>
</head>
<body>
  <section class="shell" aria-live="polite">
    <header>
      <span class="mark" aria-hidden="true"></span>
      <div class="heading">
        <div class="eyebrow">Đông Hải Knowledge</div>
        <h1>Hình ảnh từ kho tri thức</h1>
      </div>
      <span id="count" hidden></span>
    </header>
    <div id="status">Đang nhận kết quả…</div>
    <div id="gallery" hidden></div>
  </section>
  <div id="viewer" role="dialog" aria-modal="true" aria-label="Xem hình ảnh" hidden>
    <div class="viewer-bar">
      <span id="viewer-title"></span>
      <button id="close-viewer" type="button" aria-label="Đóng">×</button>
    </div>
    <img id="viewer-image" alt="">
  </div>

  <script>
    (() => {
      const statusEl = document.getElementById("status");
      const galleryEl = document.getElementById("gallery");
      const countEl = document.getElementById("count");
      const viewerEl = document.getElementById("viewer");
      const viewerImageEl = document.getElementById("viewer-image");
      const viewerTitleEl = document.getElementById("viewer-title");
      const closeViewerEl = document.getElementById("close-viewer");
      const pending = new Map();
      let nextId = 1;

      function notifySize() {
        window.parent.postMessage({
          jsonrpc: "2.0",
          method: "ui/notifications/size-changed",
          params: {
            width: document.documentElement.scrollWidth,
            height: document.documentElement.scrollHeight,
          },
        }, "*");
      }

      function request(method, params) {
        const id = nextId++;
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
        });
      }

      function assetDetails(structuredContent) {
        const details = [];
        const seen = new Set();
        const sources = Array.isArray(structuredContent?.sources)
          ? structuredContent.sources
          : [];

        for (const source of sources) {
          const assets = Array.isArray(source?.assets) ? source.assets : [];
          for (const asset of assets) {
            if (asset?.asset_type !== "image" || seen.has(asset.id)) continue;
            seen.add(asset.id);
            details.push({
              id: asset.id,
              title: typeof source?.title === "string" ? source.title : "Tài liệu",
              page: Number.isInteger(asset?.page_number) ? asset.page_number : null,
              caption: typeof asset?.caption === "string" ? asset.caption : "",
            });
            if (details.length >= 3) return details;
          }
        }
        return details;
      }

      function validImageBlock(block) {
        return block
          && block.type === "image"
          && typeof block.data === "string"
          && block.data.length > 0
          && typeof block.mimeType === "string"
          && block.mimeType.startsWith("image/");
      }

      function showImages(imageBlocks, details) {
        galleryEl.replaceChildren();
        const visibleImages = imageBlocks.slice(0, 3);

        galleryEl.dataset.count = String(visibleImages.length);
        countEl.textContent = `${visibleImages.length} hình ảnh`;
        countEl.hidden = false;

        visibleImages.forEach((block, index) => {
          const detail = details[index] || {};
          const figure = document.createElement("figure");
          const imageButton = document.createElement("button");
          const image = document.createElement("img");
          const pageBadge = document.createElement("span");
          const zoomHint = document.createElement("span");
          const caption = document.createElement("figcaption");
          const title = document.createElement("span");
          const imageTitle = detail.title || "Kho tri thức Đông Hải";
          const imageDescription = detail.caption
            || (detail.page ? `Trang ${detail.page}` : "Hình ảnh liên quan");

          imageButton.type = "button";
          imageButton.className = "image-button";
          imageButton.setAttribute("aria-label", `Xem lớn: ${imageTitle}, ${imageDescription}`);
          image.src = `data:${block.mimeType};base64,${block.data}`;
          image.alt = detail.caption || `Hình ảnh từ ${imageTitle}`;
          image.loading = "eager";

          pageBadge.className = "page-badge";
          pageBadge.textContent = detail.page ? `Trang ${detail.page}` : `Hình ${index + 1}`;
          zoomHint.className = "zoom-hint";
          zoomHint.textContent = "Nhấn để xem lớn";

          title.className = "title";
          title.textContent = imageTitle;
          caption.appendChild(title);
          caption.appendChild(document.createTextNode(imageDescription));

          imageButton.append(image, pageBadge, zoomHint);
          imageButton.addEventListener("click", () => {
            void openViewer(image.src, image.alt, `${imageTitle} · ${imageDescription}`);
          });
          figure.append(imageButton, caption);
          galleryEl.appendChild(figure);
        });

        statusEl.hidden = true;
        galleryEl.hidden = false;
        requestAnimationFrame(notifySize);
      }

      async function openViewer(src, alt, title) {
        if (window.openai?.requestDisplayMode) {
          try {
            await window.openai.requestDisplayMode({ mode: "fullscreen" });
          } catch (_) {
            // Vẫn hiển thị viewer trong khung inline nếu host từ chối fullscreen.
          }
        }

        viewerImageEl.src = src;
        viewerImageEl.alt = alt;
        viewerTitleEl.textContent = title;
        viewerEl.hidden = false;
        closeViewerEl.focus();
      }

      function closeViewer() {
        viewerEl.hidden = true;
        viewerImageEl.removeAttribute("src");
      }

      closeViewerEl.addEventListener("click", closeViewer);
      viewerEl.addEventListener("click", (event) => {
        if (event.target === viewerEl) closeViewer();
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !viewerEl.hidden) closeViewer();
      });

      async function fetchImagesFromAssets(details) {
        const blocks = [];
        for (const detail of details) {
          try {
            let result;
            if (window.openai?.callTool) {
              result = await window.openai.callTool(
                "get_knowledge_asset",
                { asset_id: detail.id }
              );
            } else {
              result = await request("tools/call", {
                name: "get_knowledge_asset",
                arguments: { asset_id: detail.id },
              });
            }
            const image = result?.content?.find(validImageBlock);
            if (image) blocks.push(image);
          } catch (_) {
            // Bỏ qua một asset lỗi; các ảnh còn lại vẫn được hiển thị.
          }
        }
        return blocks;
      }

      async function renderToolResult(result) {
        const details = assetDetails(result?.structuredContent);
        let images = Array.isArray(result?.content)
          ? result.content.filter(validImageBlock)
          : [];

        if (
          images.length === 0
          && Array.isArray(result?.structuredContent?.images)
        ) {
          images = result.structuredContent.images.filter(validImageBlock);
        }

        if (images.length === 0 && details.length > 0) {
          statusEl.hidden = false;
          statusEl.textContent = "Đang tải hình ảnh…";
          images = await fetchImagesFromAssets(details);
        }

        if (images.length === 0) {
          galleryEl.hidden = true;
          statusEl.hidden = false;
          statusEl.textContent = details.length > 0
            ? "Không thể tải hình ảnh này."
            : "Kết quả không có hình ảnh liên quan.";
          requestAnimationFrame(notifySize);
          return;
        }

        showImages(images, details);
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.id !== undefined && pending.has(message.id)) {
          const handler = pending.get(message.id);
          pending.delete(message.id);
          if (message.error) handler.reject(message.error);
          else handler.resolve(message.result);
          return;
        }

        if (message.method === "ui/notifications/tool-result") {
          void renderToolResult(message.params);
        }
      }, { passive: true });

      window.addEventListener("openai:set_globals", (event) => {
        const globals = event.detail?.globals;
        const output = globals?.toolOutput ?? window.openai?.toolOutput;
        if (output) {
          void renderToolResult({
            structuredContent: output,
            _meta: globals?.toolResponseMetadata
              ?? window.openai?.toolResponseMetadata,
          });
        }
      }, { passive: true });

      const initialOutput = window.openai?.toolOutput;
      if (initialOutput) {
        void renderToolResult({
          structuredContent: initialOutput,
          _meta: window.openai?.toolResponseMetadata,
        });
      }

      request("ui/initialize", {
        protocolVersion: "2025-06-18",
        appInfo: { name: "Dong Hai Knowledge Gallery", version: "1.0.0" },
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
      }).then(() => {
        window.parent.postMessage({
          jsonrpc: "2.0",
          method: "ui/notifications/initialized",
          params: {},
        }, "*");
      }).catch(() => {
        // ChatGPT cũ vẫn có thể cung cấp window.openai/tool-result.
      });

      new ResizeObserver(notifySize).observe(document.body);
    })();
  </script>
</body>
</html>
